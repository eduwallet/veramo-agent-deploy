---
- name: Ensure database directory exists
  file:
    state: directory
    path: "{{ database.dir }}"
    mode: 0755
  become: true

- name: Stop the existing setup
  ansible.builtin.shell:
    cmd: docker compose -p {{ compose_project }} down
    chdir: "{{ docker.dir }}"
  become: true

- name: Pruning stopped containers
  ansible.builtin.shell:
    cmd: docker container prune -f
    chdir: "{{ docker.dir }}"
  become: true

- name: Pruning unused images
  ansible.builtin.shell:
    cmd: docker image prune -f
    chdir: "{{ docker.dir }}"
  become: true

- name: Build the containers using docker compose
  ansible.builtin.shell:
    cmd: "docker compose -p {{ compose_project }} build"
    chdir: "{{ docker.dir }}"
  become: true

- name: Start the database container using docker compose
  ansible.builtin.shell:
    cmd: "docker compose -p {{ compose_project }} up -d db"
    chdir: "{{ docker.dir }}"
  become: true

- name: Wait for the database to accept connections
  ansible.builtin.shell:
    cmd: "docker compose -p {{ compose_project }} exec -T db pg_isready -U {{ database.user }} -d {{ database.name }}"
    chdir: "{{ docker.dir }}"
  become: true
  register: _pgready_result
  until: _pgready_result.rc == 0
  retries: 30
  delay: 2

- name: Ensure the database schema exists for each installation
  ansible.builtin.shell:
    cmd: "docker compose -p {{ compose_project }} exec -T db psql -U {{ database.user }} -d {{ database.name }} -c 'CREATE SCHEMA IF NOT EXISTS \"{{ installation.name }}\";'"
    chdir: "{{ docker.dir }}"
  loop: "{{ installations }}"
  loop_control:
    loop_var: installation
  become: true

- name: Run the containers using docker compose
  ansible.builtin.shell:
    cmd: "docker compose -p {{ compose_project }} up -d"
    chdir: "{{ docker.dir }}"
  become: true

- name: Clear the issuer database configurations
  ansible.builtin.shell:
    cmd: "docker compose -p {{ compose_project }} exec -T issuer_{{ installation.name }} yarn cli clear"
    chdir: "{{ docker.dir }}"
  loop: "{{ installations }}"
  loop_control:
    loop_var: installation
  become: true
  register: _clear_result
  until: _clear_result.rc == 0
  retries: 30
  delay: 2

- name: Restart the containers so configurations are reloaded into the cleared database
  ansible.builtin.shell:
    cmd: "docker compose -p {{ compose_project }} restart"
    chdir: "{{ docker.dir }}"
  become: true

- name: Wait for the certificate to settle
  ansible.builtin.uri:
    url: "{{ protocol }}://mbob.{{ basedomain }}/.well-known/openid-credential-issuer"
    follow_redirects: none
    method: GET
  register: _result
  until: _result.status == 200
  retries: 720 # 720 * 5 seconds = 1hour (60*60/5)
  delay: 5 

